<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>진행자 화면 · 별이 빛나는 밤에</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0d11">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/admin.css?v=2">
</head>
<body>
<div id="login">
  <form class="lbox" id="lform">
    <h1>별이 빛나는 밤에</h1>
    <input type="password" id="lkey" placeholder="관리자 비밀번호" autocomplete="current-password" aria-label="관리자 비밀번호">
    <button class="hb go2 wide" type="submit">들어가기</button>
    <div class="lerr" id="lerr" role="status"></div>
  </form>
</div>

<div id="host">
  <header class="top">
    <div>
      <h1>별이 빛나는 밤에</h1>
    </div>
    <div class="stat">
      <span id="hConn" class="bad">연결 중…</span>
      <span id="hPeers">0대 접속</span>
      <span id="hStatus"></span>
      <span class="big" id="hBig" aria-live="polite">대기 중</span>
    </div>
  </header>

  <div class="grid">
    <div class="stage hview">
      <div class="bar spread">
        <span></span>
        <div class="bar">
          <button class="hb sw" id="hFollow" type="button" aria-pressed="false">따라오게 하기</button>
          <button class="hb sw" id="hArt" type="button" aria-pressed="true">별자리 그림</button>
          <button class="hb sw" id="hPrevToggle" type="button" aria-pressed="true" aria-controls="hPrev">미리보기</button>
        </div>
      </div>
      <div class="hframe"><iframe id="hSky" title="진행자 하늘 화면" allow="fullscreen"></iframe></div>
      <div id="hPrev" class="hprev">
        <div>
          <div class="hplab"><span>VR 헤드셋 속 화면</span></div>
          <div class="phone"><iframe id="pVR" title="VR 화면 미리보기"></iframe></div>
        </div>
        <div>
          <div class="hplab"><span>화면으로 보기</span></div>
          <div class="phone"><iframe id="pSC" title="화면 모드 미리보기"></iframe></div>
        </div>
      </div>
      <p id="hFollowNote" hidden></p>
    </div>

    <aside class="side">
      <section aria-labelledby="inH">
        <h2 id="inH">시작</h2>
        <div class="bar"><button class="hb go2 wide" id="iStart" type="button">체험 시작</button></div>
        <div class="bar">
          <button class="hb" id="iSkip" type="button">오프닝 건너뛰기</button>
          <button class="hb" id="iReplay" type="button">오프닝 다시 재생</button>
          <button class="hb warn" id="iReset" type="button">체험 초기화</button>
        </div>
        <p class="istate" id="iState"></p>
        <p class="istate dim" id="iFilm"></p>
      </section>

      <section aria-labelledby="stH">
        <div class="bar spread"><h2 id="stH">이야기</h2></div>
        <select id="sShow" aria-label="이야기 고르기"></select>
        <div class="bar">
          <button class="hb" id="sPrev" type="button">이전</button>
          <button class="hb go2 wide" id="sGo" type="button">시작</button>
          <button class="hb warn" id="sEnd" type="button">끝내기</button>
        </div>
        <div class="scene">
          <div class="sprog"><i id="sProg"></i></div>
          <p id="sTitle"></p>
          <p id="sNote"></p>
          <p id="sCue"></p>
        </div>
        <ol class="slist" id="sList"></ol>
      </section>

      <section aria-labelledby="cnH">
        <h2 id="cnH">폰 연결</h2>
        <div class="qr">
          <canvas id="hQR" width="132" height="132" aria-label="폰 연결용 QR 코드"></canvas>
          <div>
            <input type="text" id="hLink" readonly aria-label="폰 연결 링크">
            <div class="bar"><button class="hb" id="hCopy" type="button">링크 복사</button></div>
            <div class="bar"><input type="text" id="hRoom" maxlength="24" aria-label="방 이름" style="width:110px;font-family:var(--mono)"><button class="hb" id="hRoomSet" type="button">방 바꾸기</button></div>
          </div>
        </div>
      </section>

      <details>
        <summary>진행 순서 · 타이머</summary>
        <div>
          <div class="seg">
            <button class="hb" id="hOrderGF" type="button" aria-pressed="true">① 설명 → 자유 관찰</button>
            <button class="hb" id="hOrderFG" type="button" aria-pressed="false">② 자유 관찰 → 설명</button>
          </div>
          <div class="bar"><label>설명 <input type="number" id="hGMin" min="1" max="60" value="10"> 분</label><label>자유 <input type="number" id="hFMin" min="1" max="60" value="10"> 분</label></div>
          <div class="bar"><button class="hb go2" id="hPlanStart" type="button">순서대로 시작</button></div>
          <div class="bar" id="hPlanRun" hidden>
            <button class="hb go2" id="hNext" type="button">다음 단계</button>
            <button class="hb" id="hPause" type="button">일시정지</button>
            <button class="hb warn" id="hStop" type="button">끝내기</button>
          </div>
          <p class="hn" id="hPlanInfo"></p>
          <div class="bar"><span class="hn">직접 바꾸기</span><button class="hb" id="hPhaseG" type="button" aria-pressed="false">설명 시간</button><button class="hb" id="hPhaseF" type="button" aria-pressed="false">자유 관찰</button></div>
          <div id="hManualTimers" style="display:flex;flex-direction:column;gap:8px">
            <span class="label">따로 쓰는 타이머</span>
            <div class="bar">
              <button class="hb" type="button" data-htimer="1">1분</button><button class="hb" type="button" data-htimer="3">3분</button>
              <button class="hb" type="button" data-htimer="5">5분</button><button class="hb" type="button" data-htimer="10">10분</button>
            </div>
            <div class="bar"><input type="number" id="hTimerMin" min="1" max="90" value="7"> 분 <input type="text" id="hTimerLabel" placeholder="이름" maxlength="12" style="width:90px"><button class="hb" id="hTimerCustom" type="button">시작</button><button class="hb warn" id="hTimerOff" type="button">끄기</button></div>
          </div>
        </div>
      </details>

      <details>
        <summary>모두 같이 볼 곳</summary>
        <div>
          <div class="hspots" id="hSpots"></div>
          <div class="bar"><button class="hb" id="hSpotOff" type="button">가리키기 끄기</button></div>
        </div>
      </details>

      <details>
        <summary>하늘 시각 · 날짜 · 장소</summary>
        <div>
          <div class="hwhere" id="hWhere">2026. 11. 1 · 오송호수공원</div>
          <div class="seg" id="hPlace">
            <button class="hb" type="button" data-hplace="osong" aria-pressed="true">오송호수공원</button>
            <button class="hb" type="button" data-hplace="seoul" aria-pressed="false">서울</button>
            <button class="hb" type="button" data-hplace="jeju" aria-pressed="false">제주</button>
          </div>
          <div class="bar">
            <button class="hb" type="button" id="hSkyEvent">관측회 날</button>
            <button class="hb" type="button" id="hSkyToday">오늘 밤</button>
            <input type="date" id="hDate" value="2026-11-01" min="1900-01-01" max="2100-12-31" aria-label="날짜">
          </div>
          <p class="hnote" id="hSkyNote">이야기는 언제나 관측회 날(2026년 11월 1일) 오송 하늘로 진행돼요.</p>
          <div class="hclock" id="hClock">오후 7:30</div>
          <input type="range" id="hTime" min="30" max="180" step="5" value="90" aria-label="하늘 시각">
          <div class="seg" id="hSpeed">
            <button class="hb" type="button" data-hspeed="0" aria-pressed="true">멈춤</button>
            <button class="hb" type="button" data-hspeed="1" aria-pressed="false">실제 속도</button>
            <button class="hb" type="button" data-hspeed="60" aria-pressed="false">빠르게</button>
          </div>
        </div>
      </details>

      <details>
        <summary>메시지 · 쉬는 시간</summary>
        <div>
          <div class="bar"><input type="text" id="hNote" maxlength="40" placeholder="폰 화면에 띄울 말" style="flex:1 1 160px"><button class="hb go2" id="hSend" type="button">보내기</button><button class="hb" id="hNoteClear" type="button">지우기</button></div>
          <div class="bar">
            <button class="hb" type="button" data-hnote="이쪽을 봐 주세요">이쪽을 봐 주세요</button>
            <button class="hb" type="button" data-hnote="질문 있나요?">질문 있나요?</button>
            <button class="hb" type="button" data-hnote="헤드셋을 잠깐 벗어요">헤드셋을 잠깐 벗어요</button>
          </div>
          <div class="bar"><button class="hb warn sw" id="hHold" type="button" aria-pressed="false">화면 가리기 (쉬는 시간)</button></div>
        </div>
      </details>
    </aside>
  </div>
</div>

<script src="vendor/qrcode.js?v=2"></script>
<script src="js/sky-data.js?v=2"></script>
<script src="vendor/astronomy.browser.min.js?v=2.1.19"></script>
<script src="js/sky-core.js?v=2"></script>
<script src="story.js?v=2"></script>
<script src="js/admin.js?v=2"></script>

</body>
</html>
